[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "KFGQPC"
version = "1.0.0"
description = "KFGQPC Hafs Uthmanic Quran DOCX transformation pipeline"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
    "lxml>=5.0.0",
    "regex>=2024.4.16",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pillow (>=12.3.0,<13.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
]

[project.scripts]
quran-filter = "quran_docx_filter.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
